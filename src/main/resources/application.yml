spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: distributed-file-storage
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dfs}}
    username: ${DB_USERNAME:dfs}
    password: ${DB_PASSWORD:dfs}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: dfs-hikari-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  name: Distributed File Storage System
  version: 0.1.0-phase1

info:
  app:
    name: ${app.name}
    version: ${app.version}

logging:
  level:
    root: INFO
    com.dfs: DEBUG

jwt:
  secret: ${JWT_SECRET:change-this-in-prod-to-a-long-random-value-at-least-32-bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_USER:minioadmin}
  secret-key: ${MINIO_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET:dfs-files}
